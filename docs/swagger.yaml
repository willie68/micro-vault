basePath: /api/v1
definitions:
  model.Client:
    properties:
      accesskey:
        type: string
      crt:
        additionalProperties: {}
        type: object
      groups:
        items:
          type: string
        type: array
      hash:
        type: string
      key:
        type: string
      kid:
        type: string
      name:
        type: string
      salt:
        type: string
      secret:
        description: 'BEWARE: Only for usage in playbook'
        type: string
    type: object
  model.EncryptKey:
    properties:
      alg:
        type: string
      created:
        type: string
      group:
        type: string
      id:
        type: string
      key:
        type: string
    type: object
  model.Group:
    properties:
      isclient:
        type: boolean
      key:
        type: string
      kid:
        type: string
      label:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  model.Playbook:
    properties:
      clients:
        items:
          $ref: '#/definitions/model.Client'
        type: array
      groups:
        items:
          $ref: '#/definitions/model.Group'
        type: array
      keys:
        items:
          $ref: '#/definitions/model.EncryptKey'
        type: array
    type: object
  pmodel.Group:
    properties:
      isclient:
        type: boolean
      label:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  pmodel.KeyInfo:
    properties:
      alg:
        type: string
      kid:
        type: string
    type: object
  pmodel.Message:
    properties:
      decrypt:
        description: True for message decryption and false for message encryption
        type: boolean
      id:
        description: only set when the AES key is already created
        type: string
      message:
        description: the message to en/decrypt
        type: string
      origin:
        description: who sends this message, group name or client name
        type: string
      recipient:
        description: who should receive this message, group name or client name
        type: string
      type:
        description: The type of message means group for group messages or private
          for a private message
        type: string
    type: object
  pmodel.SignMessage:
    properties:
      keyInfo:
        $ref: '#/definitions/pmodel.KeyInfo'
      message:
        description: the message to sign
        type: string
      signature:
        description: the signature
        type: string
      valid:
        type: boolean
    type: object
  serror.Serr:
    properties:
      code:
        type: integer
      key:
        type: string
      message:
        type: string
      origin:
        type: string
      service:
        type: string
    type: object
info:
  contact: {}
  description: Micro-Vault microservice dead simple key management service without
    any golden rings, just simple and secure.
  title: micro-vault service
  version: "1.0"
